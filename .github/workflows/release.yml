name: Release

on:
  push:
    branches: [main]

# Serialise runs so two quick merges can't race to push the same tag.
concurrency: release-${{ github.ref }}

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - id: release
        uses: uperl/action-rust-release-lib@v1
        with:
          create-release: true
